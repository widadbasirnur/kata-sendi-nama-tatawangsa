<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Interaktif: Kata Sendi Nama</title>
    <!-- Google Fonts & Confetti Library -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }
        .header {
            background: #e84393;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.9rem;
            opacity: 0.95;
        }
        .sound-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }
        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.45);
        }
        .quiz-body {
            padding: 30px;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: #555;
            font-size: 0.95rem;
        }
        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 25px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px 20px;
            text-align: left;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #495057;
        }
        .option-btn:hover:not(:disabled) {
            background: #fff0f5;
            border-color: #e84393;
            color: #d63031;
            transform: translateY(-2px);
        }
        .option-btn.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .explanation-box {
            background: #f0fdf4;
            border-left: 5px solid #22c55e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #166534;
            display: none;
        }
        .next-btn {
            background: #e84393;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }
        .next-btn:hover {
            background: #d63031;
        }
        .result-screen {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .result-screen h2 {
            font-size: 2rem;
            color: #1f2937;
            margin-bottom: 15px;
        }
        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #e84393;
            margin-bottom: 15px;
        }
        .result-message {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .restart-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .restart-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔊 Muzik: Tutup</button>
            <h1>Kuiz Bahasa Melayu</h1>
            <p>Topik Khusus: Kata Sendi Nama</p>
        </div>

        <div class="quiz-body" id="quizBody">
            <div class="progress-bar">
                <span id="questionCount">Soalan 1 dari 10</span>
                <span id="scoreTracker">Skor: 0</span>
            </div>

            <div class="question-box" id="questionText">
                Soalan akan dipaparkan di sini...
            </div>

            <div class="options-list" id="optionsList">
                <!-- Pilihan jawapan dimasukkan melalui JS -->
            </div>

            <div class="explanation-box" id="explanationBox">
                <strong>Penerangan:</strong> <span id="explanationText"></span>
            </div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Seterusnya ➔</button>
        </div>

        <div class="result-screen" id="resultScreen">
            <h2>Tahniah! Kuiz Selesai 🎉</h2>
            <div class="score-display" id="finalScore">0/10</div>
            <p class="result-message" id="resultMessage">Anda telah menyiapkan kuiz ini dengan jayanya.</p>
            <button class="restart-btn" onclick="restartQuiz()">Cuba Semula 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "1. Adik duduk _________ atas kerusi sambil membaca buku cerita.\nPilih Kata Sendi Nama yang paling tepat.",
                options: ["A. di", "B. pada", "C. dalam", "D. kepada"],
                answer: 0,
                explanation: "Di digunakan khusus di hadapan kata nama yang menunjukkan tempat (contohnya: di atas kerusi, di sekolah, di rumah)."
            },
            {
                question: "2. Hadiah istimewa ini diberikan _________ guru kelas kami sebagai tanda penghargaan.",
                options: ["A. pada", "B. dari", "C. kepada", "D. untuk"],
                answer: 2,
                explanation: "Kepada digunakan di hadapan kata nama yang menyatakan sasaran merujuk kepada manusia, haiwan, unsur mujarad, atau pecahan."
            },
            {
                question: "3. Cincin emas itu tersarung kemas _________ jari manis ibu.",
                options: ["A. di", "B. pada", "C. kepada", "D. dalam"],
                answer: 1,
                explanation: "Pada digunakan di hadapan kata nama yang menyatakan tempat bagi sesuatu perbuatan (seperti pada jari) atau waktu/hari."
            },
            {
                question: "4. Emak menyediakan sepinggan kuih koci yang dibuat _________ tepung pulut dan santan.",
                options: ["A. dari", "B. daripada", "C. oleh", "D. kepada"],
                answer: 1,
                explanation: "Daripada digunakan untuk menunjukkan punca asal kejadian sesuatu benda (bahan sesuatu barang), perbandingan, atau sumber."
            },
            {
                question: "5. Abang baru sahaja pulang _________ Kuala Lumpur menaiki bas ekspres.",
                options: ["A. daripada", "B. dari", "C. pada", "D. di"],
                answer: 1,
                explanation: "Dari digunakan khusus untuk arah, tempat, atau masa (asal usul tempat atau pergerakan dari suatu tempat)."
            },
            {
                question: "6. Surat khabar itu diletakkan _________ atas meja ruang tamu.",
                options: ["A. di", "B. pada", "C. kepada", "D. untuk"],
                answer: 0,
                explanation: "Di digunakan untuk tempat ('di atas meja'). Kata sendi 'pada' tidak digunakan untuk permukaan benda konkrit seperti meja."
            },
            {
                question: "7. Sumbangan ikhlas ini dikumpulkan khusus _________ membantu mangsa banjir di pantai timur.",
                options: ["A. kepada", "B. untuk", "C. pada", "D. dari"],
                answer: 1,
                explanation: "Untuk (atau bagi) digunakan untuk menunjukkan maksud tujuan atau kegunaan sesuatu hal."
            },
            {
                question: "8. Projek landskap sekolah telah berjaya disiapkan _________ kumpulan murid Tahun 6.",
                options: ["A. oleh", "B. daripada", "C. dari", "D. kepada"],
                answer: 0,
                explanation: "Oleh digunakan selepas kata kerja pasif dalam ayat pasif untuk menunjukkan pelaku (agens)."
            },
            {
                question: "9. Cikgu Amin menyampaikan ceramah _________ kepentingan menjaga kebersihan alam sekitar.",
                options: ["A. mengenai", "B. tentang", "C. pada", "D. kepada"],
                answer: 1,
                explanation: "Tentang digunakan untuk menunjukkan perkara yang diperkatakan atau rujukan tajuk."
            },
            {
                question: "10. Semangat kerjasama penduduk kampung itu _________ aur dengan tebing.",
                options: ["A. seperti", "B. tentang", "C. kepada", "D. pada"],
                answer: 0,
                explanation: "Seperti (atau bagaikan, laksana) ialah Kata Sendi Nama yang digunakan untuk menyatakan perbandingan atau persamaan."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let soundEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration, delay = 0) {
            if (!soundEnabled) return;
            initAudio();
            setTimeout(() => {
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e) {}
            }, delay);
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.15, 0);
            playTone(659.25, 'sine', 0.15, 150);
            playTone(783.99, 'sine', 0.3, 300);
        }

        function playWrongSound() {
            playTone(220, 'sawtooth', 0.2, 0);
            playTone(185, 'sawtooth', 0.3, 200);
        }

        function playVictoryFanfare() {
            playTone(523.25, 'sine', 0.2, 0);
            playTone(523.25, 'sine', 0.2, 200);
            playTone(523.25, 'sine', 0.2, 400);
            playTone(659.25, 'sine', 0.6, 600);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            let btn = document.getElementById('soundToggle');
            if (soundEnabled) {
                initAudio();
                btn.innerHTML = "🔊 Muzik: Pasang";
                playTone(440, 'sine', 0.1);
            } else {
                btn.innerHTML = "🔇 Muzik: Tutup";
            }
        }

        function loadQuestion() {
            answered = false;
            let q = questions[currentQuestion];
            document.getElementById('questionCount').innerText = `Soalan ${currentQuestion + 1} dari ${questions.length}`;
            document.getElementById('scoreTracker').innerText = `Skor: ${score}`;
            document.getElementById('questionText').innerText = q.question;
            
            let optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(index);
                optionsList.appendChild(btn);
            });

            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            let q = questions[currentQuestion];
            let buttons = document.getElementsByClassName('option-btn');

            if (selectedIndex === q.answer) {
                buttons[selectedIndex].classList.add('correct');
                score++;
                playCorrectSound();
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[q.answer].classList.add('correct');
                playWrongSound();
            }

            document.getElementById('scoreTracker').innerText = `Skor: ${score}`;
            document.getElementById('explanationText').innerText = q.explanation;
            document.getElementById('explanationBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';

            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizBody').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('finalScore').innerText = `${score}/10`;
            
            let msg = "";
            if (score === 10) {
                msg = "Tahniah! Anda sangat hebat menguasai topik Kata Sendi Nama!";
            } else if (score >= 7) {
                msg = "Syabas! Prestasi yang sangat cemerlang!";
            } else {
                msg = "Bagus! Teruskan usaha dan cuba lagi untuk lebih mantap.";
            }
            document.getElementById('resultMessage').innerText = msg;
            playVictoryFanfare();
            
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quizBody').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
